name: DiskPulse CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diskpulse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'),
            (Join-Path $env:ProgramFiles 'NSIS\makensis.exe')
          )
          $nsis = $nsisCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installation completed but makensis.exe was not found. Tried: $($nsisCandidates -join ', ')" }
          "DISKPULSE_NSIS_PATH=$nsis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run canonical verification
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1 -IncludeInstaller

  generate-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate canonical runtime for review
        shell: powershell
        run: |
          ./scripts/build-check.ps1 -OutputPath "$env:RUNNER_TEMP/generated/check.bat"
          (Get-FileHash "$env:RUNNER_TEMP/generated/check.bat" -Algorithm SHA256).Hash | Set-Content "$env:RUNNER_TEMP/generated/SHA256.txt"
      - name: Upload generated runtime
        uses: actions/upload-artifact@v4
        with:
          name: generated-check
          path: ${{ runner.temp }}/generated/
          retention-days: 7
